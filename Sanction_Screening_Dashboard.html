function cmpSec(d,l,sec){
  var h='';
  if(sec==='screening'){
    h+='<div class="kr" style="grid-template-columns:repeat(2,1fr)">';
    h+=kp('Generated',fmt(N(d.rt_generated)),null);h+=kp('Closed',fmt(N(d.rt_closed)),null);
    h+=kp('Closure Rate',fmtPct(N(d.closure_rate)),null);h+=kp('True Hits',fmt(N(d.true_hit_total)),null,{hl:true});
    h+='</div>';
    h+='<div class="kr" style="grid-template-columns:repeat(2,1fr)">';
    h+=kp('PEP',fmt(N(d.alert_pep)),null);h+=kp('Sanction',fmt(N(d.alert_sanction)),null);
    h+=kp('Internal',fmt(N(d.alert_internal)),null);h+=kp('Multitype',fmt(N(d.alert_multitype)),null);
    h+='</div>';
    h+='<div class="cd" style="margin-top:.5rem"><div class="cd-t">Individual</div><table class="tb"><thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>';
    h+='<tr><td>False Hit</td><td>'+fmt(N(d.false_hit_indiv))+'</td></tr><tr><td>True Hit</td><td>'+fmt(N(d.true_hit_indiv))+'</td></tr><tr><td>Generated</td><td>'+fmt(N(d.indiv_generated))+'</td></tr></tbody></table></div>';
    h+='<div class="cd" style="margin-top:.5rem"><div class="cd-t">Entity</div><table class="tb"><thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>';
    h+='<tr><td>False Hit</td><td>'+fmt(N(d.false_hit_entity))+'</td></tr><tr><td>True Hit</td><td>'+fmt(N(d.true_hit_entity))+'</td></tr><tr><td>Generated</td><td>'+fmt(N(d.entity_generated))+'</td></tr></tbody></table></div>';
  } else if(sec==='batch'){
    h+='<div class="kr" style="grid-template-columns:repeat(2,1fr)">';
    h+=kp('Generated',fmt(N(d.batch_generated)),null);h+=kp('Closed',fmt(N(d.batch_closed)),null);
    h+=kp('True Hit',fmt(N(d.batch_th_total)),null,{hl:true});h+=kp('False Hit',fmt(N(d.batch_total_fh)),null);
    h+='</div>';
    h+='<div class="kr" style="grid-template-columns:repeat(3,1fr)">';
    h+=kp('PEP',fmt(N(d.batch_th_pep)),null);h+=kp('Crime',fmt(N(d.batch_th_crime)),null);h+=kp('PEP/Crime',fmt(N(d.batch_th_pepcrime)),null);
    h+='</div>';
    // Scenario table
    h+='<div class="cd" style="margin-top:.5rem"><div class="cd-t">Detail</div><table class="tb"><thead><tr><th>Scenario</th><th>FH</th><th>TH</th></tr></thead><tbody>';
    var sc=d.batch_scenarios||{};['BATCH_PEP_INDIVIDUAL','BATCH_SANC_INDIVIDUAL','BATCH_INTERNAL_INDIVIDUAL','BATCH_PEP_MERCHANT','BATCH_SANC_MERCHANT','BATCH_SANC_INTERNAL_MERCHANT'].forEach(function(s){var v=sc[s];if(v)h+='<tr><td style="font-size:.6rem">'+s.replace('BATCH_','')+'</td><td>'+fmt(v.false_hit)+'</td><td>'+fmt(v.true_hit)+'</td></tr>'});
    h+='</tbody></table></div>';
  } else if(sec==='remittance'){
    h+='<div class="kr" style="grid-template-columns:repeat(2,1fr)">';
    h+=kp('Data Received',fmt(N(d.rem_data_received)),null);h+=kp('False Hit',fmt(N(d.rem_false_hit)),null);
    h+=kp('True Hit',String(N(d.rem_true_hit)),null);h+=kp('Hit Rate',fmtPct(N(d.rem_hit_rate)),null);
    h+='</div>';
    h+='<div class="kr" style="grid-template-columns:repeat(2,1fr)">';
    h+=kp('Shop IDs',fmt(N(d.subm_shop_id)),null);h+=kp('Sub-M Hit',String(N(d.subm_total_hit)),null);
    h+='</div>';
  } else if(sec==='newsletter'){
    h+='<div class="kr" style="grid-template-columns:repeat(2,1fr)">';
    h+=kp('Names',fmt(N(d.news_total)),null);h+=kp('Count',String(N(d.news_count)),null);h+=kp('Avg',String(N(d.news_avg)),null);
    h+='</div>';
    h+='<div class="cd" style="margin-top:.5rem"><div class="cd-t">Log</div><table class="tb"><thead><tr><th>Date</th><th>Subject</th><th>Names</th></tr></thead><tbody>';
    (d.news_rows||[]).forEach(function(r){h+='<tr><td style="font-size:.6rem">'+r.email_date+'</td><td style="font-size:.6rem">'+r.subject+'</td><td>'+r.recorded_names+'</td></tr>'});
    h+='</tbody></table></div>';
  }
  return h;
}

function render(){
  destroyCharts();
  ['sel-month','sel-month-sc','sel-month-rem','sel-month-news','cmp-a','cmp-b'].forEach(buildSel);
  ['fp-dash','fp-sc','fp-rem'].forEach(buildFilter);
  var a=document.querySelector('.tab-page.on');if(!a)return;
  var id=a.id.replace('tab-','');
  if(id==='dashboard')renderDashboard();
  else if(id==='screening')renderScreening();
  else if(id==='remittance')renderRemittance();
  else if(id==='newsletter')renderNewsletter();
  else if(id==='dttot')renderDTTOT();
  else if(id==='compare'){document.getElementById('cmp-content').innerHTML='<div class="placeholder">Compare \u2014 coming soon</div>'};
}
function switchTab(id,el){document.querySelectorAll('.sb-item').forEach(function(i){i.classList.remove('on')});el.classList.add('on');document.querySelectorAll('.tab-page').forEach(function(p){p.classList.remove('on')});document.getElementById('tab-'+id).classList.add('on');render();window.scrollTo({top:0,behavior:'smooth'})}
function toggleSidebar(){var sb=document.getElementById('sidebar');sb.classList.toggle('collapsed');localStorage.setItem('sb_collapsed',sb.classList.contains('collapsed')?'1':'0')}
document.addEventListener('DOMContentLoaded',function(){
  if(localStorage.getItem('sb_collapsed')==='1'){var sb=document.getElementById('sidebar');if(sb)sb.classList.add('collapsed')}
  var tip=document.getElementById('sb-float-tip'),hide;

function initBatchFilter(){var s=document.getElementById('batch-mf');if(!s)return;s.innerHTML='<option value="all">All Months</option>';getMonths().forEach(function(m){var o=document.createElement('option');o.value=m;o.textContent=m;if(m===curMonth)o.selected=true;s.appendChild(o)});s.onchange=function(){var mf=this.value;var scO=['BATCH_PEP_INDIVIDUAL','BATCH_SANC_INDIVIDUAL','BATCH_INTERNAL_INDIVIDUAL','BATCH_PEP_MERCHANT','BATCH_SANC_MERCHANT','BATCH_SANC_INTERNAL_MERCHANT'];var ms2=mf==='all'?getMonths():[mf];var t='<table class="tb"><thead><tr><th>Month</th><th style=\"text-align:left\">Scenario</th><th>False Hit</th><th>True Hit</th><th>Manual Close</th><th>Auto Close</th><th>Generated</th></tr></thead><tbody>';ms2.forEach(function(m){var r=STORE.data[m]||{};var sc=r.batch_scenarios||{};var f=true;scO.forEach(function(n){var v=sc[n];if(v){t+="<tr><td>"+(f?shortMonth(m):"")+"</td><td style=\"text-align:left\">"+n+"</td><td>"+fmt(v.false_hit)+"</td><td>"+fmt(v.true_hit)+"</td><td>"+fmt(v.manually_closed)+"</td><td>"+fmt(v.automation_closed)+"</td><td>"+fmt(v.alert_generated)+"</td></tr>";f=false}})});t+="</tbody></table>";var parent=s.parentElement.parentElement;var existingTable=parent.querySelector("table");if(existingTable)existingTable.outerHTML=t}}
</script>
